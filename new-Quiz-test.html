<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux File Systems Matching Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #1B1B1B;
            overflow-x: hidden;
        }

        /* Matching container styles */
        .matching-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .items-column {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .match-item {
            padding: 0.75rem 1rem;
            border: 2px solid #4a5568;
            border-radius: 0.75rem;
            background-color: #111827;
            color: #d1d5db;
            cursor: grab;
            transition: all 0.2s ease-in-out;
            user-select: none;
            font-size: 0.9rem;
        }

        .match-item:hover:not(.matched) {
            border-color: #60a5fa;
            transform: translateY(-2px);
        }

        .match-item.matched {
            cursor: default;
            opacity: 0.8;
        }

        .match-item.dragging {
            opacity: 0.7;
            transform: scale(1.05);
            z-index: 10;
        }

        .match-target {
            padding: 0.75rem 1rem;
            border: 2px dashed #4a5568;
            border-radius: 0.75rem;
            background-color: #111827;
            min-height: 3rem;
            transition: all 0.2s ease-in-out;
            font-size: 0.9rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .match-target.hover {
            border-color: #60a5fa;
            background-color: #1e293b;
        }

        .match-target.filled {
            border-style: solid;
            border-color: #4a5568;
            color: #d1d5db;
        }

        .match-target.correct {
            border-color: #22c55e;
            background-color: rgba(34, 197, 94, 0.1);
        }

        .match-target.incorrect {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
        }

        .match-pair {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .match-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.5rem;
            background-color: #4a5568;
            color: white;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 600;
            margin-right: 0.5rem;
        }

        /* Buttons */
        .btn {
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            border: none;
            cursor: pointer;
            display: inline-block;
            font-size: 0.8rem;
        }

        .btn-primary {
            background-color: #FCA300;
            color: #111827;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #e59400;
        }

        .btn-secondary {
            background-color: transparent;
            color: #9ca3af;
            border: 1px solid #4a5568;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #111827;
            color: #ffffff;
            border-color: #9ca3af;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .explanation {
            margin-top: 0.75rem;
            padding: 0.75rem;
            border-left: 5px solid #3b82f6;
            background-color: #1B1B1B;
            color: #d1d5db;
            border-radius: 0.5rem;
            font-size: 0.85rem;
        }

        .score-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            background-color: #FCA300;
            color: #111827;
            font-weight: 600;
            font-size: 0.75rem;
        }
    </style>
</head>
<body class="bg-[#1B1B1B] p-4">

    <main id="quiz-container" class="w-full mx-auto max-w-4xl">
        <div id="quiz-content" class="bg-[#1B1B1B] p-4">
            
            <div class="flex justify-between items-center mb-4">
                <div id="question-navigation" class="text-sm font-medium text-gray-400">
                    <span id="current-question-number">1</span> / <span id="total-questions">3</span>
                </div>
                <div class="score-badge">
                    Score: <span id="current-score">0</span>
                </div>
            </div>
            
            <div id="current-question-container" class="space-y-6"></div>

            <div id="feedback-area" class="mt-3 hidden">
                <div id="explanation-text" class="explanation"></div>
            </div>

            <div class="flex flex-wrap justify-between items-start mt-8 gap-3">
                <button id="prev-btn" class="btn btn-secondary" disabled>Previous</button>
                
                <div class="flex flex-col sm:flex-row space-y-3 sm:space-y-0 sm:space-x-3 ml-auto">
                    <button id="check-answer-btn" class="btn btn-primary">Check Answer</button>
                    <button id="next-btn" class="btn btn-primary" disabled>Next</button>
                </div>
            </div>
        </div>

        <div id="results-screen" class="hidden bg-[#1B1B1B] p-4">
            <h2 class="text-xl font-bold text-white text-center mb-3">Quiz Complete!</h2>
            <p id="score-text" class="text-lg text-gray-300 text-center font-semibold mb-6"></p>
            <div id="results-summary" class="space-y-4"></div>
            <div class="text-center mt-6">
                <button id="restart-btn" class="btn btn-primary">Retake Quiz</button>
            </div>
        </div>
    </main>

    <script>
        const matchingData = [
            {
                question: "Match the Linux concepts with their descriptions:",
                items: [
                    { id: 1, text: "File" },
                    { id: 2, text: "Hierarchical Structure" },
                    { id: 3, text: "/etc directory" },
                    { id: 4, text: "/home directory" }
                ],
                targets: [
                    { id: 'a', text: "Basic component for data storage" },
                    { id: 'b', text: "Organization starting from root ('/')" },
                    { id: 'c', text: "Contains system-wide configuration files" },
                    { id: 'd', text: "Home directories for ordinary users" }
                ],
                correctMatches: {
                    '1': 'a',
                    '2': 'b',
                    '3': 'c',
                    '4': 'd'
                },
                fullExplanation: `
                    <strong>Correct matches:</strong><br>
                    1. File → Basic component for data storage<br>
                    2. Hierarchical Structure → Organization starting from root ('/')<br>
                    3. /etc directory → Contains system-wide configuration files<br>
                    4. /home directory → Home directories for ordinary users
                `
            },
            {
                question: "Match the UFS features with their descriptions:",
                items: [
                    { id: 1, text: "Journaling" },
                    { id: 2, text: "Hot fixes" }
                ],
                targets: [
                    { id: 'a', text: "Recovers files after system crashes" },
                    { id: 'b', text: "Moves data from damaged disk portions" }
                ],
                correctMatches: {
                    '1': 'a',
                    '2': 'b'
                },
                fullExplanation: `
                    <strong>Correct matches:</strong><br>
                    1. Journaling → Recovers files after system crashes<br>
                    2. Hot fixes → Moves data from damaged disk portions
                `
            },
            {
                question: "Match the Linux commands with their purposes:",
                items: [
                    { id: 1, text: "cp" },
                    { id: 2, text: "rm" },
                    { id: 3, text: "chmod" },
                    { id: 4, text: "'x' permission" }
                ],
                targets: [
                    { id: 'a', text: "Copy files between directories" },
                    { id: 'b', text: "Delete files" },
                    { id: 'c', text: "Set file permissions" },
                    { id: 'd', text: "Execute permission" }
                ],
                correctMatches: {
                    '1': 'a',
                    '2': 'b',
                    '3': 'c',
                    '4': 'd'
                },
                fullExplanation: `
                    <strong>Correct matches:</strong><br>
                    1. cp → Copy files between directories<br>
                    2. rm → Delete files<br>
                    3. chmod → Set file permissions<br>
                    4. 'x' permission → Execute permission
                `
            }
        ];

        let currentQuestionIndex = 0;
        let totalScore = 0;
        const userMatches = matchingData.map(() => ({})); // Store user's matches for each question
        const answeredQuestions = matchingData.map(() => false);

        const quizContentEl = document.getElementById('quiz-content');
        const currentQuestionContainerEl = document.getElementById('current-question-container');
        const resultsScreenEl = document.getElementById('results-screen');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const checkAnswerBtn = document.getElementById('check-answer-btn');
        const restartBtn = document.getElementById('restart-btn');
        const feedbackAreaEl = document.getElementById('feedback-area');
        const explanationTextEl = document.getElementById('explanation-text');
        const currentQuestionNumberEl = document.getElementById('current-question-number');
        const totalQuestionsEl = document.getElementById('total-questions');
        const currentScoreEl = document.getElementById('current-score');

        totalQuestionsEl.textContent = matchingData.length;

        function renderQuestion(index) {
            const questionData = matchingData[index];
            currentQuestionContainerEl.innerHTML = `
                <div class="question-item" data-index="${index}">
                    <h2 class="text-base font-semibold text-gray-300 mb-2">${questionData.question}</h2>
                    <p class="text-sm text-gray-400 mb-4">Drag items from the left column to their matching descriptions on the right.</p>
                    
                    <div class="matching-container">
                        <div class="items-column">
                            <h3 class="text-sm font-semibold text-gray-400 mb-2">Items to Match</h3>
                            ${questionData.items.map(item => `
                                <div class="match-item" 
                                     draggable="true" 
                                     data-item-id="${item.id}"
                                     data-item-text="${item.text}">
                                    <span class="match-number">${item.id}</span>${item.text}
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="items-column">
                            <h3 class="text-sm font-semibold text-gray-400 mb-2">Descriptions</h3>
                            ${questionData.targets.map(target => `
                                <div class="match-target" 
                                     data-target-id="${target.id}"
                                     data-target-text="${target.text}">
                                    ${target.text}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    
                    <div class="mt-6 p-4 border border-gray-700 rounded-lg">
                        <h4 class="text-sm font-semibold text-gray-300 mb-2">Your Matches:</h4>
                        <div id="current-matches-${index}" class="space-y-2">
                            ${Object.entries(userMatches[index]).map(([itemId, targetId]) => {
                                const item = questionData.items.find(i => i.id == itemId);
                                const target = questionData.targets.find(t => t.id == targetId);
                                return `
                                    <div class="text-xs text-gray-300">
                                        ${item.text} → ${target.text}
                                    </div>
                                `;
                            }).join('') || '<p class="text-xs text-gray-500">No matches yet. Drag items to the descriptions.</p>'}
                        </div>
                    </div>
                </div>
            `;

            currentQuestionNumberEl.textContent = index + 1;
            currentScoreEl.textContent = totalScore;

            // Add drag and drop functionality
            setupDragAndDrop(index);

            // Update navigation buttons
            prevBtn.disabled = index === 0;
            nextBtn.disabled = !answeredQuestions[index] && index !== matchingData.length - 1;
            
            if (index === matchingData.length - 1) {
                nextBtn.textContent = answeredQuestions[index] ? 'Show Results' : 'Done';
                nextBtn.disabled = !answeredQuestions[index];
            } else {
                nextBtn.textContent = 'Next';
            }

            // Update check button and feedback
            if (answeredQuestions[index]) {
                checkAnswerBtn.disabled = true;
                feedbackAreaEl.classList.remove('hidden');
                explanationTextEl.innerHTML = questionData.fullExplanation;
                showQuestionFeedback(index);
            } else {
                const totalMatches = Object.keys(userMatches[index]).length;
                checkAnswerBtn.disabled = totalMatches !== questionData.items.length;
                feedbackAreaEl.classList.add('hidden');
            }
        }

        function setupDragAndDrop(questionIndex) {
            const matchItems = document.querySelectorAll('.match-item:not(.matched)');
            const matchTargets = document.querySelectorAll('.match-target');

            matchItems.forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
            });

            matchTargets.forEach(target => {
                target.addEventListener('dragover', handleDragOver);
                target.addEventListener('dragenter', handleDragEnter);
                target.addEventListener('dragleave', handleDragLeave);
                target.addEventListener('drop', (e) => handleDrop(e, questionIndex));
            });
        }

        function handleDragStart(e) {
            e.dataTransfer.setData('text/plain', e.target.dataset.itemId);
            e.target.classList.add('dragging');
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDragEnter(e) {
            e.preventDefault();
            if (!e.target.classList.contains('filled')) {
                e.target.classList.add('hover');
            }
        }

        function handleDragLeave(e) {
            e.target.classList.remove('hover');
        }

        function handleDrop(e, questionIndex) {
            e.preventDefault();
            const targetEl = e.target;
            targetEl.classList.remove('hover');

            if (answeredQuestions[questionIndex] || targetEl.classList.contains('filled')) {
                return;
            }

            const itemId = e.dataTransfer.getData('text/plain');
            const draggedItem = document.querySelector(`.match-item[data-item-id="${itemId}"]`);
            
            if (!draggedItem || draggedItem.classList.contains('matched')) {
                return;
            }

            // Mark item as matched
            draggedItem.classList.add('matched');
            draggedItem.style.opacity = '0.5';
            draggedItem.draggable = false;

            // Fill target
            const itemText = draggedItem.dataset.itemText;
            targetEl.classList.add('filled');
            targetEl.innerHTML = `
                <span class="match-number">${itemId}</span>${itemText}
                <br>
                <small class="text-xs text-gray-400">${targetEl.dataset.targetText}</small>
            `;
            targetEl.dataset.matchedItemId = itemId;

            // Store the match
            userMatches[questionIndex][itemId] = targetEl.dataset.targetId;

            // Update matches display
            updateMatchesDisplay(questionIndex);

            // Enable check button if all items are matched
            const questionData = matchingData[questionIndex];
            const totalMatches = Object.keys(userMatches[questionIndex]).length;
            checkAnswerBtn.disabled = totalMatches !== questionData.items.length;
        }

        function updateMatchesDisplay(questionIndex) {
            const questionData = matchingData[questionIndex];
            const matchesContainer = document.getElementById(`current-matches-${questionIndex}`);
            
            const matches = Object.entries(userMatches[questionIndex]).map(([itemId, targetId]) => {
                const item = questionData.items.find(i => i.id == itemId);
                const target = questionData.targets.find(t => t.id == targetId);
                return { item, target };
            });

            matchesContainer.innerHTML = matches.length 
                ? matches.map(match => `
                    <div class="text-xs text-gray-300 p-2 bg-gray-800 rounded">
                        <strong>${match.item.text}</strong> → ${match.target.text}
                    </div>
                `).join('')
                : '<p class="text-xs text-gray-500">No matches yet. Drag items to the descriptions.</p>';
        }

        function checkAnswer() {
            const questionIndex = currentQuestionIndex;
            const questionData = matchingData[questionIndex];
            
            if (answeredQuestions[questionIndex]) return;

            answeredQuestions[questionIndex] = true;
            
            // Check each match
            let correctCount = 0;
            const userMatchesObj = userMatches[questionIndex];
            
            Object.entries(userMatchesObj).forEach(([itemId, targetId]) => {
                const targetEl = document.querySelector(`.match-target[data-target-id="${targetId}"]`);
                const isCorrect = questionData.correctMatches[itemId] === targetId;
                
                if (isCorrect) {
                    targetEl.classList.add('correct');
                    correctCount++;
                } else {
                    targetEl.classList.add('incorrect');
                    // Show what it should have been
                    const correctTargetId = questionData.correctMatches[itemId];
                    const correctTarget = questionData.targets.find(t => t.id === correctTargetId);
                    targetEl.innerHTML += `<br><small class="text-xs text-red-400">Should be: ${correctTarget.text}</small>`;
                }
            });

            // Add score
            const questionScore = Math.round((correctCount / questionData.items.length) * 100);
            totalScore += questionScore;

            // Update UI
            checkAnswerBtn.disabled = true;
            feedbackAreaEl.classList.remove('hidden');
            explanationTextEl.innerHTML = questionData.fullExplanation;
            
            // Enable next button
            nextBtn.disabled = false;
            if (currentQuestionIndex === matchingData.length - 1) {
                nextBtn.textContent = 'Show Results';
            }
        }

        function showQuestionFeedback(questionIndex) {
            const questionData = matchingData[questionIndex];
            const matchTargets = document.querySelectorAll('.match-target');
            
            matchTargets.forEach(target => {
                const targetId = target.dataset.targetId;
                const matchedItemId = target.dataset.matchedItemId;
                
                if (matchedItemId) {
                    const isCorrect = questionData.correctMatches[matchedItemId] === targetId;
                    target.classList.add(isCorrect ? 'correct' : 'incorrect');
                    
                    if (!isCorrect) {
                        const correctTargetId = questionData.correctMatches[matchedItemId];
                        const correctTarget = questionData.targets.find(t => t.id === correctTargetId);
                        target.innerHTML += `<br><small class="text-xs text-red-400">Should be: ${correctTarget.text}</small>`;
                    }
                }
            });
        }

        function navigate(direction) {
            if (direction === 'next') {
                if (currentQuestionIndex < matchingData.length - 1) {
                    currentQuestionIndex++;
                    renderQuestion(currentQuestionIndex);
                } else if (currentQuestionIndex === matchingData.length - 1) {
                    showResults();
                }
            } else if (direction === 'prev' && currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion(currentQuestionIndex);
            }
        }

        function showResults() {
            quizContentEl.classList.add('hidden');
            resultsScreenEl.classList.remove('hidden');

            const finalScore = Math.round(totalScore / matchingData.length);
            const resultsSummaryEl = document.getElementById('results-summary');
            resultsSummaryEl.innerHTML = '';

            document.getElementById('score-text').textContent = `Final Score: ${finalScore}%`;

            matchingData.forEach((question, index) => {
                const questionData = matchingData[index];
                const userMatchObj = userMatches[index];
                
                // Calculate question score
                let correctCount = 0;
                Object.entries(userMatchObj).forEach(([itemId, targetId]) => {
                    if (questionData.correctMatches[itemId] === targetId) {
                        correctCount++;
                    }
                });
                const questionScore = Math.round((correctCount / questionData.items.length) * 100);

                const resultItem = document.createElement('div');
                resultItem.className = 'p-4 border rounded-lg';
                
                if (answeredQuestions[index]) {
                    resultItem.classList.add(questionScore >= 50 ? 'border-green-500' : 'border-red-500');
                    resultItem.style.backgroundColor = questionScore >= 50 ? 'rgba(34, 197, 94, 0.1)' : 'rgba(239, 68, 68, 0.1)';
                } else {
                    resultItem.classList.add('border-gray-500');
                    resultItem.style.backgroundColor = '#111827';
                }

                resultItem.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <p class="font-semibold text-sm text-white">Question ${index + 1}</p>
                        <span class="text-xs font-bold ${questionScore >= 50 ? 'text-green-400' : 'text-red-400'}">
                            ${questionScore}%
                        </span>
                    </div>
                    <p class="text-xs text-gray-300 mb-2">${question.question}</p>
                    ${answeredQuestions[index] 
                        ? `<p class="text-xs text-gray-400">${correctCount} out of ${questionData.items.length} correct</p>`
                        : '<p class="text-xs text-gray-400 font-bold">Question was not answered.</p>'
                    }
                `;
                resultsSummaryEl.appendChild(resultItem);
            });
        }

        // Event listeners
        checkAnswerBtn.addEventListener('click', checkAnswer);
        prevBtn.addEventListener('click', () => navigate('prev'));
        nextBtn.addEventListener('click', () => navigate('next'));
        restartBtn.addEventListener('click', () => location.reload());

        // Initial render
        renderQuestion(currentQuestionIndex);
    </script>
</body>
</html>
